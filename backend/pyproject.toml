[project]
name = "notes-backend"
version = "0.1.0"
description = "Local-only FastAPI sidecar for the Local Notes Assistant. Binds to 127.0.0.1, requires a per-launch session token."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "psutil>=6,<8",
    "pypdf>=5,<7",
    "markitdown[docx]>=0.1,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
package = ["pyinstaller>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
