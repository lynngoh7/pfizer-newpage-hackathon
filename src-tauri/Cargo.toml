[package]
name = "local-notes-assistant"
version = "0.1.0"
description = "Fully local notes assistant. Nothing leaves the machine."
edition = "2021"

[lib]
name = "local_notes_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
