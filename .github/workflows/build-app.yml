# Builds the desktop app on every OS we ship to and checks the bundled
# backend starts. Manual only (Actions tab → Build app → Run workflow), because
# Mac runners use Actions minutes fast. Installers are attached to the run.
name: Build app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, windows-latest, ubuntu-22.04] # Apple Silicon, Intel Mac, Windows, Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows, so the same scripts run everywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: sh scripts/build-sidecar.sh
      - name: Bundled backend starts and answers /health
        run: |
          BIN=$(ls src-tauri/binaries/notes-backend-*)
          export NOTES_SESSION_TOKEN=$(printf 'x%.0s' $(seq 64)) NOTES_PORT=8765
          "$BIN" &
          for i in $(seq 60); do
            if curl -sf -H "Authorization: Bearer $NOTES_SESSION_TOKEN" http://127.0.0.1:8765/api/health; then kill $! || true; exit 0; fi
            sleep 1
          done
          echo "backend did not answer"; exit 1
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
